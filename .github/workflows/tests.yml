name: Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: ai_service_request_test
          POSTGRES_USER: service_request_user
          POSTGRES_PASSWORD: service_request_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U service_request_user -d ai_service_request_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: >-
        postgresql+psycopg://service_request_user:service_request_password@localhost:5432/ai_service_request_test

      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5-mini

      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q